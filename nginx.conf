server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sem isso, alguns navegadores assumem Latin-1 e os acentos quebram —
    # mesmo com <meta charset="UTF-8"> no HTML.
    charset utf-8;

    location / {
        try_files $uri /index.html;
    }
}
