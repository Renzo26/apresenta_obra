<meta charset="UTF-8">
<title>Visão na Obra</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #ffffff;
    --ink: #14212b;
    --ink-2: #4a6070;
    --ink-3: #8095a4;
    --line: #dde5ea;
    --line-soft: #eef2f5;
    --accent: #1d6a93;
    --accent-soft: #e8f1f6;
    --good: #1d6b45;
    --warn: #a9640b;
    --crit: #a5332a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0d1720;
      --ink: #eaf0f4;
      --ink-2: #aebfcb;
      --ink-3: #7b8f9d;
      --line: #27394a;
      --line-soft: #1b2b39;
      --accent: #6fb6d9;
      --accent-soft: #14303f;
      --good: #6cc294;
      --warn: #e0a24f;
      --crit: #ec8177;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0d1720;
    --ink: #eaf0f4;
    --ink-2: #aebfcb;
    --ink-3: #7b8f9d;
    --line: #27394a;
    --line-soft: #1b2b39;
    --accent: #6fb6d9;
    --accent-soft: #14303f;
    --good: #6cc294;
    --warn: #e0a24f;
    --crit: #ec8177;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }
  #root { min-height: 100%; display: flex; flex-direction: column; }

  .deck { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .slide {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
    max-width: 940px;
    width: 100%;
    margin: 0 auto;
    padding-left: 20px;
    padding-right: 20px;
    padding-block: 48px 32px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0;
  }
  h1 {
    font-size: clamp(30px, 6vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin: 0;
    text-wrap: balance;
  }
  h2 {
    font-size: clamp(24px, 4.4vw, 36px);
    line-height: 1.12;
    letter-spacing: -0.025em;
    margin: 0;
    text-wrap: balance;
  }
  .lede { font-size: clamp(16px, 2.2vw, 19px); color: var(--ink-2); margin: 0; max-width: 60ch; }
  .note { font-size: 13.5px; color: var(--ink-3); margin: 0; max-width: 70ch; }

  .cover-meta { display: flex; flex-wrap: wrap; gap: 8px 26px; font-size: 14px; color: var(--ink-3); }

  /* Listas de itens */
  .items { display: grid; gap: 14px; grid-template-columns: repeat(2, 1fr); }
  .item { border-top: 2px solid var(--line); padding-top: 12px; }
  .item h3 { font-size: 17px; margin: 0 0 3px; letter-spacing: -0.01em; }
  .item p { margin: 0; font-size: 14.5px; color: var(--ink-2); }
  .item.on { border-top-color: var(--accent); }

  /* Tabelas */
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: clamp(14px, 2vw, 17px); }
  th, td { padding: 11px 14px; text-align: right; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    border-bottom: 1px solid var(--line);
  }
  tbody tr:last-child td { border-bottom: none; }
  .num { font-variant-numeric: tabular-nums; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  tr.on td { background: var(--accent-soft); font-weight: 600; }
  tr.on td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .tag {
    display: inline-block;
    margin-left: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    background: var(--accent-soft);
    color: var(--accent);
    vertical-align: 1px;
  }
  .tag.good { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
  .tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }

  /* Comparação lado a lado */
  .versus { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card { border: 1px solid var(--line); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .card.on { border-color: var(--accent); }
  .card h3 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
  .card .big { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14.5px; }
  .card dt { color: var(--ink-3); }
  .card dd { margin: 0; color: var(--ink-2); text-align: right; }

  /* Fases */
  .phases { display: grid; gap: 16px; grid-template-columns: repeat(3, 1fr); }
  .phase { border-top: 3px solid var(--accent); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .phase .when { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .phase h3 { margin: 0; font-size: 17px; }
  .phase p { margin: 0; font-size: 14.5px; color: var(--ink-2); }
  .phase .cost { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  ul.plain { margin: 0; padding-left: 20px; }
  ul.plain li { margin-bottom: 8px; color: var(--ink-2); font-size: 15.5px; }
  ul.plain li:last-child { margin-bottom: 0; }
  ul.plain strong { color: var(--ink); font-weight: 600; }

  /* Barra de navegação */
  .bar {
    position: sticky;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 20px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
    background: var(--ground);
  }
  .dots { display: flex; gap: 7px; flex-wrap: wrap; }
  .dot {
    width: 9px; height: 9px; padding: 0; border-radius: 50%;
    border: 1px solid var(--line); background: transparent; cursor: pointer;
  }
  .dot[aria-current="true"] { background: var(--accent); border-color: var(--accent); }
  .nav { display: flex; align-items: center; gap: 10px; }
  .nav button {
    font: inherit;
    font-size: 14px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    border-radius: 2px;
  }
  .nav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .nav button:disabled { opacity: 0.35; cursor: default; }
  .counter { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 46px; text-align: center; }
  button:focus-visible, .dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 720px) {
    .items, .versus, .phases { grid-template-columns: 1fr; }
    .slide { gap: 18px; padding-block: 28px 20px; }
  }
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
  const { useState, useEffect, useCallback, createElement } = React
  const html = htm.bind(createElement)

  // ── Conteúdo ──────────────────────────────────────────────────────────────

  const modulos = [
    ['EPI', 'Capacete, colete, óculos, luvas, cinto e mais, em foto, vídeo ou câmera.'],
    ['Áreas de risco', 'A IA lê a cena, aponta os riscos e a NR aplicável, e desenha a área de cada um.'],
    ['Monitoramento por área', 'Área desenhada com EPI obrigatório. Quem entra sem ele gera ocorrência com foto.'],
    ['Fumaça', 'Detecta fumaça e fogo, separando de vapor, poeira e névoa.'],
  ]

  const intervalos = [
    ['1 segundo', '2.592.000', '3,51', '2.530', 'pedido', 'warn'],
    ['1,8 segundos', '1.440.000', '2,40', '1.727', 'hoje', ''],
    ['5 segundos', '518.400', '1,24', '893', 'recomendado', 'good'],
    ['10 segundos', '259.200', '0,71', '514', '', ''],
    ['30 segundos', '86.400', '0,24', '173', '', ''],
  ]

  const cameras = [
    ['1 câmera', '2.592.000', '2.530', '2.530'],
    ['2 câmeras', '5.184.000', '4.049', '2.024'],
    ['5 câmeras', '12.960.000', '7.159', '1.432'],
    ['10 câmeras', '25.920.000', '12.343', '1.234'],
  ]

  const porSolucao = [
    ['EPI e monitoramento por área', '3,51', '2.530', '1,24', '893'],
    ['Áreas de risco', '3,57', '2.569', '1,29', '932'],
    ['Fumaça e fogo', '3,53', '2.541', '1,26', '904'],
    ['As três na mesma câmera', '5,69', '4.098', '2,02', '1.454'],
  ]

  const arquiteturas = [
    ['Nuvem, como está hoje', '2.530', 'Sem servidor para manter', 'Custo cresce com o uso'],
    ['SAM 3 em GPU própria', '200 a 500', 'Imagens ilimitadas', 'Uma câmera por placa'],
    ['Modelo treinado, servidor próprio', '25 a 200', 'Imagens ilimitadas', 'Dez câmeras ou mais'],
  ]

  // ── Slides ────────────────────────────────────────────────────────────────

  const Titulo = ({ eyebrow, children }) => html`
    <div>
      ${eyebrow && html`<p class="eyebrow">${eyebrow}</p>`}
      <h2>${children}</h2>
    </div>
  `

  const slides = [
    {
      nome: 'Capa',
      render: () => html`
        <div class="slide">
          <p class="eyebrow">Segurança do trabalho · Visão computacional</p>
          <h1>Quatro módulos prontos e o que custa manter as câmeras analisadas</h1>
          <p class="lede">
            Detecção de EPI, áreas de risco, monitoramento por área e fumaça — com os custos
            de cada cenário de operação e os caminhos para reduzi-los.
          </p>
          <div class="cover-meta">
            <span>Setembro de 2026</span>
            <span>Valores em dólar, por câmera</span>
            <span>Use as setas do teclado</span>
          </div>
        </div>
      `,
    },
    {
      nome: 'Módulos',
      render: () => html`
        <div class="slide">
          <${Titulo} eyebrow="O que já funciona">Quatro módulos, rodando hoje<//>
          <div class="items">
            ${modulos.map(([t, d]) => html`
              <div class="item on" key=${t}>
                <h3>${t}</h3>
                <p>${d}</p>
              </div>
            `)}
          </div>
          <p class="note">
            Todos aceitam vídeo, foto e webcam. As ocorrências ficam salvas com o quadro do
            momento, em histórico com filtro por data.
          </p>
        </div>
      `,
    },
    {
      nome: 'Cobrança',
      render: () => html`
        <div class="slide">
          <${Titulo} eyebrow="Como a conta é calculada">A cobrança é por imagem analisada, não por hora de câmera ligada<//>
          <div class="items">
            <div class="item on">
              <h3>Transmissão não custa por tempo</h3>
              <p>A câmera pode ficar ligada o dia inteiro. O que gera custo é cada quadro enviado ao modelo.</p>
            </div>
            <div class="item on">
              <h3>O intervalo define o preço</h3>
              <p>Analisar a cada 1 segundo custa quase três vezes mais que a cada 5 segundos.</p>
            </div>
            <div class="item on">
              <h3>O preço cai com o volume</h3>
              <p>Acima de 250 mil imagens no mês o valor por imagem diminui, chegando a 80% de desconto.</p>
            </div>
            <div class="item on">
              <h3>Cada módulo é uma análise</h3>
              <p>EPI e áreas de risco dividem a mesma. Fumaça é uma segunda, porque procura outra coisa.</p>
            </div>
          </div>
        </div>
      `,
    },
    {
      nome: 'Ao vivo',
      render: () => html`
        <div class="slide">
          <${Titulo} eyebrow="A pergunta mais comum">Câmera ao vivo, 24 horas por dia: quanto custa a hora?<//>
          <div class="versus">
            <div class="card">
              <h3>A transmissão em si</h3>
              <span class="big">US$ 0,00 / hora</span>
              <p class="note">
                Manter a câmera aberta não é cobrado. O modelo não assiste ao vídeo: ele recebe
                quadros, um a um.
              </p>
            </div>
            <div class="card on">
              <h3>A análise desses quadros</h3>
              <span class="big">US$ 1,24 a 5,69 / hora</span>
              <p class="note">
                Depende de duas escolhas: de quantos em quantos segundos analisar, e quantos dos
                três módulos ficam ligados na mesma câmera.
              </p>
            </div>
          </div>
          <p class="note">
            Por isso "stream ao vivo" e "1 foto por segundo" custam a mesma coisa: ao vivo, na
            prática, é analisar um quadro por segundo. O que muda a fatura é o intervalo.
          </p>
        </div>
      `,
    },
    {
      nome: 'Por solução',
      render: () => html`
        <div class="slide">
          <${Titulo} eyebrow="Uma câmera, 24 horas por dia">O custo de cada uma das três soluções<//>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">Solução</th>
                  <th scope="col">US$/h · 1 foto/s</th>
                  <th scope="col">US$/mês · 1 foto/s</th>
                  <th scope="col">US$/h · a cada 5s</th>
                  <th scope="col">US$/mês · a cada 5s</th>
                </tr>
              </thead>
              <tbody>
                ${porSolucao.map(([n, h1, m1, h5, m5], i) => html`
                  <tr key=${n} class=${i === 3 ? 'on' : ''}>
                    <td>${n}</td>
                    <td class="num">${h1}</td>
                    <td class="num">${m1}</td>
                    <td class="num">${h5}</td>
                    <td class="num">${m5}</td>
                  </tr>
                `)}
              </tbody>
            </table>
          </div>
          <p class="note">
            EPI e áreas de risco dividem a mesma análise de imagem; fumaça precisa de uma segunda,
            por isso as três juntas não custam o triplo. A leitura de riscos e a confirmação de
            fumaça pela IA de texto entram com US$ 39 e US$ 11 por mês, porque rodam sob demanda.
          </p>
        </div>
      `,
    },
    {
      nome: 'Intervalos',
      render: () => html`
        <div class="slide">
          <${Titulo} eyebrow="Uma câmera, 24 horas por dia">Quanto custa cada ritmo de análise<//>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">Intervalo</th>
                  <th scope="col">Imagens / mês</th>
                  <th scope="col">US$ / hora</th>
                  <th scope="col">US$ / mês</th>
                </tr>
              </thead>
              <tbody>
                ${intervalos.map(([i, img, h, m, tag, tone]) => html`
                  <tr key=${i} class=${tone === 'good' ? 'on' : ''}>
                    <td>${i}${tag && html`<span class=${'tag ' + tone}>${tag}</span>`}</td>
                    <td class="num">${img}</td>
                    <td class="num">${h}</td>
                    <td class="num">${m}</td>
                  </tr>
                `)}
              </tbody>
            </table>
          </div>
          <p class="note">
            Numa obra, quem está sem capacete continua sem capacete no segundo seguinte, e fumaça
            leva dezenas de segundos para se formar: 5 segundos detecta os mesmos eventos e corta
            65% da conta. Analisar só das 6h às 18h reduz pela metade de novo.
          </p>
        </div>
      `,
    },
    {
      nome: 'Câmeras',
      render: () => html`
        <div class="slide">
          <${Titulo} eyebrow="Todas a 1 foto por segundo">Quando entram mais câmeras<//>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">Quantidade</th>
                  <th scope="col">Imagens / mês</th>
                  <th scope="col">US$ / mês</th>
                  <th scope="col">US$ por câmera</th>
                </tr>
              </thead>
              <tbody>
                ${cameras.map(([c, img, t, u]) => html`
                  <tr key=${c}>
                    <td>${c}</td>
                    <td class="num">${img}</td>
                    <td class="num">${t}</td>
                    <td class="num">${u}</td>
                  </tr>
                `)}
              </tbody>
            </table>
          </div>
          <p class="note">
            O custo por câmera cai porque o desconto por volume vale para a conta inteira. Ainda
            assim, a partir de duas câmeras já compensa trocar de arquitetura.
          </p>
        </div>
      `,
    },
    {
      nome: 'Modelos',
      render: () => html`
        <div class="slide">
          <${Titulo} eyebrow="Dois modelos possíveis">Modelo aberto ou modelo treinado para a obra<//>
          <div class="versus">
            <div class="card">
              <h3>SAM 3 — o que usamos hoje</h3>
              <p class="note">Entende pedidos em texto: "capacete", "fumaça", "luvas".</p>
              <dl>
                <dt>Por imagem</dt><dd>1 a 3 segundos</dd>
                <dt>Custo</dt><dd>US$ 0,002 por imagem</dd>
                <dt>Item novo</dt><dd>trocar uma palavra</dd>
                <dt>Câmeras por servidor</dt><dd>1</dd>
              </dl>
            </div>
            <div class="card on">
              <h3>Modelo treinado com as imagens da obra</h3>
              <p class="note">Aprende os itens do canteiro a partir de fotos reais das câmeras.</p>
              <dl>
                <dt>Por imagem</dt><dd>0,03 a 0,05 segundo</dd>
                <dt>Custo</dt><dd>zero por imagem</dd>
                <dt>Item novo</dt><dd>rotular e treinar</dd>
                <dt>Câmeras por servidor</dt><dd>10 ou mais</dd>
              </dl>
            </div>
          </div>
          <p class="note">
            O modelo treinado também corrige falhas do modelo aberto: nos testes, botas de
            segurança nunca foram detectadas, mesmo com todos calçados. Treinado com imagens da
            obra, esse tipo de buraco desaparece.
          </p>
        </div>
      `,
    },
    {
      nome: 'Arquiteturas',
      render: () => html`
        <div class="slide">
          <${Titulo} eyebrow="Uma câmera a 1 foto por segundo, 24 horas">Três formas de operar, três patamares de custo<//>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">Arquitetura</th>
                  <th scope="col">US$ / mês</th>
                  <th scope="col">Vantagem</th>
                  <th scope="col">Limite</th>
                </tr>
              </thead>
              <tbody>
                ${arquiteturas.map(([a, c, v, l], i) => html`
                  <tr key=${a} class=${i === 2 ? 'on' : ''}>
                    <td>${a}</td>
                    <td class="num">${c}</td>
                    <td>${v}</td>
                    <td>${l}</td>
                  </tr>
                `)}
              </tbody>
            </table>
          </div>
          <p class="note">
            A confirmação de fumaça por IA continua na nuvem em qualquer cenário e custa de
            US$ 1 a 11 por mês, porque roda uma vez por evento, não a cada quadro.
          </p>
        </div>
      `,
    },
  ]

  // ── Navegação ─────────────────────────────────────────────────────────────

  function Deck() {
    const [i, setI] = useState(0)
    const ir = useCallback((n) => setI((cur) => Math.min(slides.length - 1, Math.max(0, n))), [])

    useEffect(() => {
      const onKey = (e) => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); ir(i + 1) }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); ir(i - 1) }
        else if (e.key === 'Home') ir(0)
        else if (e.key === 'End') ir(slides.length - 1)
      }
      window.addEventListener('keydown', onKey)
      return () => window.removeEventListener('keydown', onKey)
    }, [i, ir])

    return html`
      <div class="deck">
        ${slides[i].render()}
        <div class="bar">
          <div class="dots">
            ${slides.map((s, n) => html`
              <button
                key=${s.nome}
                class="dot"
                type="button"
                aria-current=${n === i}
                aria-label=${'Ir para ' + s.nome}
                title=${s.nome}
                onClick=${() => ir(n)}
              ></button>
            `)}
          </div>
          <div class="nav">
            <button type="button" onClick=${() => ir(i - 1)} disabled=${i === 0}>Anterior</button>
            <span class="counter">${i + 1} / ${slides.length}</span>
            <button type="button" onClick=${() => ir(i + 1)} disabled=${i === slides.length - 1}>Próximo</button>
          </div>
        </div>
      </div>
    `
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${Deck} />`)
</script>
